name: psdkit
description: A dependency-free Dart reader and writer for Photoshop PSD and PSB documents.
version: 0.1.0
homepage: https://github.com/focale-editor/psdkit

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  zcodec:
    git: https://github.com/focale-editor/zcodec.git

dev_dependencies:
  analyzer: ^14.1.0
  lints: ^6.1.0
  release: ^0.1.10
  test: ^1.31.2

release:
  changelog:
    header: '# PsdKit changelog'
    defaultIgnoredTypes: ['test']
    defaultIgnoredScopes: ['repo', 'docs', 'version', 'deps', 'tools']
