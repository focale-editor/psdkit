name: psdkit
description: A pure Dart PSD and PSB reader and writer with no native or third-party PSD dependency.
version: 0.2.0
homepage: https://github.com/focale-editor/psdkit
repository: https://github.com/focale-editor/psdkit

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  pscore: '>=0.1.0 <0.2.0'
  zcodec: '>=0.1.0 <0.2.0'

dev_dependencies:
  analyzer: ^14.1.0
  lints: ^6.1.0
  release: ^0.1.11
  test: ^1.31.2

release:
  changelog:
    header: '# 📰 PsdKit changelog'
    defaultIgnoredTypes: ['test']
    defaultIgnoredScopes: ['repo', 'docs', 'version', 'deps', 'tools']
