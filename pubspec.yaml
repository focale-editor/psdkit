name: psdkit
description: A pure Dart PSD and PSB reader and writer with no native or third-party PSD dependency.
version: 0.4.5
homepage: https://github.com/focale-editor/psdkit
repository: https://github.com/focale-editor/psdkit

topics:
  - photoshop
  - psd
  - image-processing
  - codec
  - file-format

screenshots:
  - description: 'A flat illustration of an editable PSD or PSB document.'
    path: screenshots/overview.png

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  aslkit: ^0.3.0
  pscore: ^0.2.0
  zcodec: '>=0.2.0 <0.3.0'

dev_dependencies:
  analyzer: ^14.5.0
  lints: ^6.1.0
  release: ^0.1.11
  test: ^1.32.0

release:
  changelog:
    header: '# 📰 PsdKit changelog'
    defaultIgnoredTypes: ['test']
    defaultIgnoredScopes: ['repo', 'docs', 'version', 'deps', 'tools']
